[package]
name = "simple-crud-app"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "postgres", "uuid"] }
dotenv = "0.15.0"
env_logger = "0.11.5"
log = "0.4"
argon2 = "0.5"
base64 = "0.22.1"
async-trait = "0.1.83"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
actix-cors = "0.7.0"
futures = "0.3.31"
